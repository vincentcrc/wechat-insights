<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微信洞察</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --panel-2:#fbfaf8; --line:#e7e4de; --line-2:#d9d5cd;
  --ink:#1c1b19; --ink-2:#4a4843; --ink-3:#85817a; --accent:#1f5eff; --accent-ink:#fff;
  --major:#d93f3f; --major-bg:#fdecec; --focus:#c47a00; --focus-bg:#fff4df; --info:#6b7280; --info-bg:#f1f1ef;
  --ok:#1f8f4e; --ok-bg:#e6f5ec; --watch:#2563eb; --watch-bg:#e8efff;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141412; --panel:#1c1c1a; --panel-2:#20201e; --line:#2d2c29; --line-2:#3a3935;
    --ink:#ecebe7; --ink-2:#bdbab3; --ink-3:#85817a; --accent:#6b93ff; --accent-ink:#0b0b0a;
    --major:#ff6b6b; --major-bg:#3a1f1f; --focus:#f0b43c; --focus-bg:#3a2d14; --info:#9a978f; --info-bg:#262523;
    --ok:#4cc27e; --ok-bg:#16301f; --watch:#7aa2ff; --watch-bg:#1a2440;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141412; --panel:#1c1c1a; --panel-2:#20201e; --line:#2d2c29; --line-2:#3a3935;
  --ink:#ecebe7; --ink-2:#bdbab3; --ink-3:#85817a; --accent:#6b93ff; --accent-ink:#0b0b0a;
  --major:#ff6b6b; --major-bg:#3a1f1f; --focus:#f0b43c; --focus-bg:#3a2d14; --info:#9a978f; --info-bg:#262523;
  --ok:#4cc27e; --ok-bg:#16301f; --watch:#7aa2ff; --watch-bg:#1a2440;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 80px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:18px;margin:0;letter-spacing:.5px}
.brand .sub{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:7px}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:6px;min-width:190px;display:none;z-index:30}
.menu.open .menu-pop{display:block}
.menu-pop button,.menu-pop label{display:flex;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;gap:8px;align-items:center;cursor:pointer}
.menu-pop button:hover,.menu-pop label:hover{background:var(--panel-2)}

/* dimension + periods */
.dimrow{display:flex;align-items:center;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:7px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.periods{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;flex:1;min-width:0}
.pchip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.pchip b{font-weight:600;color:var(--ink)}
.pchip small{color:var(--ink-3)}
.pchip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pchip .dot{width:7px;height:7px;border-radius:50%;background:var(--major)}

/* period header */
.phead{display:grid;grid-template-columns:1fr auto;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.phead h2{margin:0 0 2px;font-size:20px}
.phead .range{color:var(--ink-3);font-size:12px;margin-bottom:8px}
.phead .range .tag{display:inline-block;border:1px solid var(--line-2);border-radius:5px;padding:0 6px;margin-right:6px;color:var(--ink-2)}
.phead p{margin:0;color:var(--ink-2);max-width:80ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(78px,1fr));gap:8px;align-self:start}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel-2);text-align:left;cursor:pointer}
.kpi:hover{border-color:var(--ink-3)}
.kpi .n{font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink-3)}
.kpi.major .n{color:var(--major)} .kpi.focus .n{color:var(--focus)} .kpi.due .n{color:var(--watch)}

/* carry-over */
.carry{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.carry summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 18px;cursor:pointer;font-weight:600}
.carry summary::-webkit-details-marker{display:none}
.carry summary .hint{font-weight:400;color:var(--ink-3);font-size:12px}
.carry summary .chev{margin-left:auto;color:var(--ink-3);transition:transform .15s}
.carry[open] summary .chev{transform:rotate(90deg)}
.carry ul{list-style:none;margin:0;padding:0 10px 10px}
.carry li{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}
.carry li:hover{background:var(--panel-2)}
.carry li .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carry li .from{color:var(--ink-3);font-size:12px}

/* filters */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 12px}
.search{flex:1 1 220px;min-width:180px;display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--panel);border-radius:9px;padding:6px 10px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
.search kbd{font:11px ui-monospace,monospace;color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:0 4px}
select.sel{border:1px solid var(--line-2);background:var(--panel);border-radius:9px;padding:6px 8px;max-width:190px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{color:var(--ink-3)} .chip.on .c{color:inherit;opacity:.7}
.toggle{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;cursor:pointer;user-select:none}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--info)}
.card.major::before{background:var(--major)} .card.focus::before{background:var(--focus)}
.card.is-done{opacity:.62}
.card.is-done h3{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.card.sel{outline:2px solid var(--accent);outline-offset:-1px}
.card.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.card .in{padding:14px 16px 12px 18px}
.chead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.lv{font-weight:700;border-radius:5px;padding:1px 7px;font-size:11.5px}
.lv.major{background:var(--major-bg);color:var(--major)} .lv.focus{background:var(--focus-bg);color:var(--focus)} .lv.info{background:var(--info-bg);color:var(--info)}
.cat{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
.cat i{width:8px;height:8px;border-radius:2px;display:inline-block}
.kind{border:1px solid var(--line-2);border-radius:5px;padding:0 5px}
.cdate{margin-left:auto;white-space:nowrap}
.pbadge{border-radius:5px;padding:0 6px;background:var(--panel-2);border:1px dashed var(--line-2);white-space:nowrap}
.card h3{font-size:15.5px;line-height:1.4;margin:8px 0 6px}
.card .sum{margin:0;color:var(--ink-2);font-size:13.5px}
.action{margin-top:10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);padding:8px 10px;font-size:13px}
.action b{color:var(--ink);margin-right:4px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.due{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--watch-bg);color:var(--watch);font-weight:600}
.due.over{background:var(--major-bg);color:var(--major)} .due.soon{background:var(--focus-bg);color:var(--focus)}
.who{font-size:12px;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.ev{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.ev summary{cursor:pointer;color:var(--ink-3);font-size:12px;list-style:none}
.ev summary::-webkit-details-marker{display:none}
.ev summary::before{content:"▸ ";}
.ev[open] summary::before{content:"▾ ";}
.ev ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.ev li{font-size:12.5px;border-left:2px solid var(--line-2);padding:2px 0 2px 8px;color:var(--ink-2)}
.ev li .m{color:var(--ink-3);font-size:11.5px;display:block}
.cfoot{margin-top:auto;display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding:8px 10px 8px 14px;background:var(--panel-2);flex-wrap:wrap}
.st{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.st button{border:0;background:none;padding:3px 9px;font-size:12px;color:var(--ink-3)}
.st button+button{border-left:1px solid var(--line-2)}
.st button.on[data-s="open"]{background:var(--major-bg);color:var(--major);font-weight:600}
.st button.on[data-s="watch"]{background:var(--watch-bg);color:var(--watch);font-weight:600}
.st button.on[data-s="done"]{background:var(--ok-bg);color:var(--ok);font-weight:600}
.st button.on[data-s="info"]{background:var(--info-bg);color:var(--info);font-weight:600}
.iconbtn{border:0;background:none;padding:3px 6px;border-radius:6px;color:var(--ink-3);font-size:13px}
.iconbtn:hover{background:var(--line);color:var(--ink)}
.iconbtn.star.on{color:#e0a100}
.pick{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);cursor:pointer}
.note{width:100%;margin-top:6px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:6px 8px;font-size:12.5px;resize:vertical;min-height:34px;display:none}
.card.has-note .note,.card.edit-note .note{display:block}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:0;width:2px;background:var(--line)}
.tl-day{margin-bottom:18px}
.tl-day h4{margin:0 0 8px;font-size:13px;color:var(--ink-2);position:relative}
.tl-day h4::before{content:"";position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--ink-3)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.row:hover{border-color:var(--ink-3)}
.row .t{font-weight:600}
.row .s{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.is-done .t{text-decoration:line-through;color:var(--ink-3)}

/* threads */
.threads{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.thread{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.thread h3{margin:0 0 10px;font-size:15px;display:flex;gap:8px;align-items:center}
.thread h3 small{font-weight:400;color:var(--ink-3);font-size:12px}
.thread ol{list-style:none;margin:0;padding:0;position:relative}
.thread li{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:6px 0;border-top:1px dashed var(--line);cursor:pointer}
.thread li:first-child{border-top:0}
.thread li .d{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.thread li .t{font-size:13px}
.thread li.is-done .t{color:var(--ink-3);text-decoration:line-through}

.empty{padding:50px 20px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:var(--radius)}

/* batch bar */
.batch{position:fixed;left:50%;bottom:18px;transform:translate(-50%,120px);transition:transform .2s;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:40;max-width:calc(100vw - 32px)}
.batch.show{transform:translate(-50%,0)}
.batch .btn{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.batch .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.dialog{background:var(--panel);border-radius:14px;max-width:760px;width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dialog header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dialog header h3{margin:0;font-size:16px}
.dialog .body{padding:14px 18px;overflow:auto;display:grid;gap:12px}
.dialog label.f{display:grid;gap:4px;font-size:12px;color:var(--ink-3)}
.dialog textarea{width:100%;border:1px solid var(--line-2);border-radius:10px;background:var(--panel-2);padding:10px 12px;font:12.5px/1.6 ui-monospace,"SF Mono",Menlo,monospace;min-height:120px;resize:vertical}
.dialog textarea.prompt{min-height:300px;font-family:inherit;font-size:13px}
.dialog footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:5px 11px}
.opts button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.help{font-size:12px;color:var(--ink-3)}
.toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--bg);border-radius:9px;padding:8px 14px;transition:.2s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 已完成 */
body.v-done .dimrow, body.v-done #phead, body.v-done #carry, body.v-done #inbox {display:none}
#inbox:empty{display:none}
body.v-sns #phead, body.v-sns #carry, body.v-sns #inbox, body.v-sns #fStatus, body.v-sns #fChat, body.v-sns #fStar, body.v-sns #fStar + *, body.v-sns #lvChips, body.v-sns #catChips {display:none}
body.v-sns .toggle:has(#fStar){display:none}
.snsbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:4px 0 14px}
.snsbar h2{margin:0;font-size:20px}
.snsfeed{display:grid;gap:10px;max-width:820px}
.sday{margin:10px 0 2px;font-size:13px;color:var(--ink-2);font-weight:600}
.sns{display:grid;grid-template-columns:40px 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sns.ad{opacity:.55}
.sns .av{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:16px}
.sns .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sns .hd b{font-size:14px}
.sns .tm{color:var(--ink-3);font-size:12px}
.sns .kd{font-size:11px;border:1px solid var(--line-2);border-radius:5px;padding:0 5px;color:var(--ink-3)}
.sns .tg{font-size:11px;border-radius:5px;padding:0 6px;background:var(--focus-bg);color:var(--focus)}
.sns .tx{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;font-size:14px}
.sns .lk{margin-top:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--ink-2)}
.sns .loc{margin-top:4px;font-size:12px;color:var(--ink-3)}
.sns .ft{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.sns mark{background:var(--focus-bg);color:inherit}
.ibx li{grid-template-columns:auto 1fr auto auto auto}
.ibx .snip{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibx .dotf{width:8px;height:8px;border-radius:50%;background:var(--focus)} .ibx .doti{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
body.v-done #fStatus{display:none}
.donehead{display:flex;align-items:baseline;gap:10px;margin:18px 0 12px}
.donehead h2{margin:0;font-size:20px}
.dgroup{margin-bottom:16px}
.dgroup h4{margin:0 0 8px;font-size:13px;color:var(--ink-2)}
.drow{display:grid;grid-template-columns:48px auto 1fr auto auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.drow:hover{border-color:var(--ink-3)}
.drow .tm{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.drow .t{min-width:0}
.drow .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .t small{color:var(--ink-3);font-size:12px}
.drow .ok{color:var(--ok);font-weight:700}
.dexp{margin:-2px 0 10px}
.card.leaving{transition:opacity .25s, transform .25s;opacity:0;transform:scale(.97)}
#viewSeg button .cnt{font-size:11px;color:var(--ink-3);margin-left:4px}
#viewSeg button.on .cnt{color:inherit;opacity:.7}
.toast button{margin-left:10px;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;pointer-events:auto}
.toast.show{pointer-events:auto}
@media (max-width:760px){ .drow{grid-template-columns:40px 1fr auto} .drow .lv,.drow .from{display:none} }

/* 本地服务 */
.svb{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:default}
.svb i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.svb.on i{background:var(--ok)} .svb.warn i{background:var(--focus)} .svb.run i{background:var(--watch);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.stp{border:1px solid var(--line-2);border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--ink-3)}
.stp.running{border-color:var(--watch);color:var(--watch);font-weight:600}
.stp.done{border-color:var(--ok);color:var(--ok)} .stp.error{border-color:var(--major);color:var(--major)} .stp.skipped{opacity:.5;text-decoration:line-through}
.jlog{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:12px/1.6 ui-monospace,Menlo,monospace;max-height:180px;overflow:auto;color:var(--ink-2)}
.jlog div span{color:var(--ink-3);margin-right:8px}
.notice{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--focus-bg);color:var(--ink)}
.notice.err{background:var(--major-bg)} .notice.ok{background:var(--ok-bg)}
.notice code{background:var(--panel);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;font-size:12px}
.res h4{margin:6px 0 4px;font-size:13px}
.res ul{margin:0;padding-left:18px;font-size:13px}
.answer{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.7;white-space:normal}
.answer p{margin:.3em 0}
.msgs{display:grid;gap:10px}
.mchat{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mchat h5{margin:0;padding:7px 12px;background:var(--panel-2);font-size:13px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.mchat h5 small{color:var(--ink-3);font-weight:400}
.mchat ol{list-style:none;margin:0;padding:6px 12px;max-height:320px;overflow:auto;display:grid;gap:3px}
.mchat li{font-size:12.5px;color:var(--ink-2)}
.mchat li .tm{color:var(--ink-3);font-size:11.5px;margin-right:6px;font-variant-numeric:tabular-nums}
.mchat li.me{color:var(--ink)} .mchat li.me .who2{color:var(--accent)}
.mchat mark{background:var(--focus-bg);color:inherit;border-radius:3px;padding:0 2px}
.who2{font-weight:600;margin-right:4px}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2 input[type=date]{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:4px 6px}
.dialog.wide{max-width:900px}

@media (max-width:760px){
  .wrap{padding:0 16px 90px}
  .brand .sub{display:none}
  .phead{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .grid,.threads{grid-template-columns:1fr}
  .carry li{grid-template-columns:auto 1fr auto}
  .carry li .cat,.carry li .from{display:none}
  .top .btn .lbl{display:none}
  .periods{flex-basis:100%}
  .carry summary .hint{display:none}
  .kpi{padding:8px}
  .kpi .l{font-size:11px}
}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="brand"><h1>微信洞察</h1><span class="sub" id="sub"></span></div>
  <div class="spacer"></div>
  <span class="svb" id="svBadge"></span>
  <button class="btn" id="btnUpdate" title="生成让 Claude 拉取新一期数据的指令">⟳ <span class="lbl">更新数据</span></button>
  <button class="btn primary" id="btnQuery" title="按当前筛选生成查询指令">⌕ <span class="lbl">生成查询指令</span></button>
  <div class="menu" id="menu">
    <button class="btn ghost" id="btnMore" aria-label="更多">⋯</button>
    <div class="menu-pop">
      <button id="mExport">⤓ 导出处理状态（JSON）</button>
      <button id="mImport">⤒ 导入处理状态</button>
      <label><input type="checkbox" id="mPrivate"> 显示「私密」分类</label>
      <button id="mTheme">◐ 切换深浅色</button>
      <button id="mReset">↺ 清空本机处理状态</button>
    </div>
  </div>
  <input type="file" id="fileImport" accept="application/json" hidden>
</div></div>

<main class="wrap">
  <div class="dimrow">
    <div class="seg" id="dimSeg">
      <button data-d="day">日</button><button data-d="week">周</button><button data-d="month">月</button><button data-d="all">全部</button>
    </div>
    <div class="periods" id="periods"></div>
  </div>

  <section class="phead" id="phead"></section>

  <details class="carry" id="carry" open></details>
  <details class="carry" id="inbox" open></details>

  <div class="filters">
    <label class="search"><span>⌕</span><input id="q" placeholder="搜索标题、摘要、人名、会话…"><kbd>/</kbd></label>
    <select class="sel" id="fStatus">
      <option value="">全部（不含已完成）</option>
      <option value="active">未完成（待处理+跟进）</option>
      <option value="open">待处理</option>
      <option value="watch">跟进中</option>
      <option value="info">仅参考</option>
    </select>
    <select class="sel" id="fChat"><option value="">全部会话</option></select>
    <label class="toggle"><input type="checkbox" id="fStar"> 仅星标</label>
    <div class="spacer"></div>
    <div class="seg" id="viewSeg"><button data-v="cards">卡片</button><button data-v="timeline">时间线</button><button data-v="threads">线索</button><button data-v="sns">朋友圈</button><button data-v="done">已完成<span class="cnt" id="doneCnt"></span></button></div>
  </div>
  <div class="chips" id="lvChips"></div>
  <div class="chips" id="catChips"></div>

  <div id="content"></div>
</main>

<div class="batch" id="batch">
  <span id="batchN"></span>
  <button class="btn sm" id="bDone">标记完成</button>
  <button class="btn sm primary" id="bQuery">生成查询指令</button>
  <button class="btn sm" id="bClear">取消</button>
</div>

<div class="modal" id="modal"><div class="dialog">
  <header><h3 id="mTitle"></h3><div class="spacer"></div><button class="btn ghost" data-close>✕</button></header>
  <div class="body" id="mBody"></div>
  <footer id="mFoot"></footer>
</div></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
(function(){
"use strict";
const D = window.WXI_DATA;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WEEKDAY = ["日","一","二","三","四","五","六"];

if (!D) {
  document.querySelector("main").innerHTML = '<div class="empty" style="margin-top:40px">没找到 data.js。请在终端运行 <code>python3 ~/wechat-insights/build.py</code> 后刷新。</div>';
  return;
}

/* ---------- 本地服务（用 App 打开时可用） ---------- */
const SV = window.WXI_SERVER || null;
let SVS = null;
async function api(path, body){
  const r = await fetch(path, {method: body ? "POST" : "GET", headers: {"X-WXI-Token": SV.token, "Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || ("HTTP " + r.status)), {data: j, status: r.status});
  return j;
}

/* ---------- 本机状态（处理进度 / 星标 / 备注） ---------- */
const STORE = "wxi.state.v1", PREF = "wxi.pref.v1";
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let S = load(STORE, {});
const pref = Object.assign({dim:"week", period:null, view:"cards", status:"", showPrivate:false, theme:null, levels:[], cats:[]}, load(PREF, {}));
if (pref.theme) document.documentElement.dataset.theme = pref.theme;
if (pref.status === "done") pref.status = "";
/* 每天第一次打开回到「当前」周期（不然过了周末还停在上周） */
if (pref.openedOn !== new Date().toDateString()) { pref.period = null; pref.openedOn = new Date().toDateString(); }

const st = c => (S[c.id] && S[c.id].status) || c.status || "info";
const starred = c => !!(S[c.id] && S[c.id].star);
const noteOf = c => (S[c.id] && S[c.id].note) || "";
function setState(id, patch){ S[id] = Object.assign({}, S[id], patch, {updated: new Date().toISOString()}); save(STORE, S); pushState(); }
/* 完成时间：优先用户点「完成」的时间；数据里本身就是 done 的卡片（Claude 标的）用卡片的 done_at 或日期 */
function migrateState(){ Object.values(S).forEach(v => { if (v.status === "done" && !v.done_at) v.done_at = v.updated || new Date().toISOString(); }); save(STORE, S); }
migrateState();
function doneAt(c){
  const v = S[c.id];
  if (v && v.status) return v.status === "done" ? (v.done_at || v.updated || "") : "";
  return c.status === "done" ? (c.done_at || c.date + "T00:00:00") : "";
}
const isDone = c => st(c) === "done";
function setStatus(id, s){
  const prev = Object.assign({}, S[id]);
  setState(id, s === "done" ? {status: "done", done_at: new Date().toISOString()} : {status: s, done_at: null});
  return prev;
}
function pushState(){ if (!SV) return; clearTimeout(pushState.t); pushState.t = setTimeout(() => api("/api/state", {state: S}).catch(() => {}), 800); }

/* ---------- 日期工具 ---------- */
const parse = s => { const [y,m,d] = s.slice(0,10).split("-").map(Number); return new Date(y, m-1, d); };
const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const md = s => s ? s.slice(5,10) : "";
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear(), w = Math.ceil(((t - Date.UTC(y,0,1)) / 864e5 + 1) / 7);
  return `${y}-W${String(w).padStart(2,"0")}`;
}
function weekRange(id){
  const [y, w] = id.split("-W").map(Number);
  const jan4 = new Date(y, 0, 4), mon = new Date(jan4); mon.setDate(jan4.getDate() - ((jan4.getDay()+6)%7) + (w-1)*7);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return [fmt(mon), fmt(sun)];
}
const TODAY = fmt(new Date());
const daysTo = s => Math.round((parse(s) - parse(TODAY)) / 864e5);
function dueLabel(s){
  const n = daysTo(s);
  if (n < 0) return {t:`已过期 ${-n} 天 · ${md(s)}`, cls:"over"};
  if (n === 0) return {t:`今天到期 · ${md(s)}`, cls:"over"};
  if (n <= 3) return {t:`还有 ${n} 天 · ${md(s)}`, cls:"soon"};
  return {t:`截止 ${md(s)} · ${n} 天`, cls:""};
}
const bucket = (c, dim) => dim === "day" ? c.date : dim === "week" ? isoWeek(parse(c.date)) : dim === "month" ? c.date.slice(0,7) : "all";
const periodById = id => D.periods.find(p => p.id === id);

/* ---------- 可见卡片集合 ---------- */
const cardsAll = () => D.cards.filter(c => pref.showPrivate || c.category !== "private");

function bucketsFor(dim){
  const m = new Map();
  cardsAll().forEach(c => {
    if (c.rollup && dim !== "month") return;
    const b = bucket(c, dim);
    const o = m.get(b) || {id:b, n:0, major:0};
    if (!isDone(c) && c.category !== "inbox") o.n++; if (c.level === "major" && ["open","watch"].includes(st(c))) o.major++;
    m.set(b, o);
  });
  return [...m.values()].sort((a,b) => b.id.localeCompare(a.id));
}
function inPeriod(c){
  if (pref.dim === "all") return true;
  if (c.rollup && pref.dim !== "month") return false;
  if (pref.dim === "day" && c.due === pref.period) return true;
  return bucket(c, pref.dim) === pref.period;
}
function matchFilters(c, opts = {}){
  const s = st(c);
  if (c.category === "inbox" && !pref.cats.includes("inbox") && !opts.keepDone) return false;
  if (s === "done" && !opts.keepDone) return false;
  if (!opts.ignoreStatus && pref.status === "active" && !["open","watch"].includes(s)) return false;
  if (!opts.ignoreStatus && pref.status && pref.status !== "active" && s !== pref.status) return false;
  if (pref.levels.length && !pref.levels.includes(c.level)) return false;
  if (pref.cats.length && !pref.cats.includes(c.category)) return false;
  if ($("#fStar").checked && !starred(c)) return false;
  const chat = $("#fChat").value;
  if (chat && !c.chats.includes(chat)) return false;
  const q = $("#q").value.trim().toLowerCase();
  if (q) {
    const hay = [c.title, c.summary, c.action, ...c.people, ...c.chats, ...c.tags, noteOf(c), ...(c.evidence||[]).map(e => e.join(" "))].join(" ").toLowerCase();
    if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}
const rankSort = (a, b) =>
  (D.levels[a.level].rank - D.levels[b.level].rank) ||
  (["open","watch","info","done"].indexOf(st(a)) - ["open","watch","info","done"].indexOf(st(b))) ||
  ((a.due || "9999").localeCompare(b.due || "9999")) || b.date.localeCompare(a.date);

/* ---------- 渲染：维度与周期 ---------- */
function periodLabel(dim, id){
  if (dim === "day") { const d = parse(id); return {main: md(id), sub: (id === TODAY ? "今天 · " : "") + "周" + WEEKDAY[d.getDay()]}; }
  if (dim === "week") { const [a,b] = weekRange(id); const cur = isoWeek(parse(TODAY)) === id; return {main: `W${id.split("-W")[1]}`, sub: (cur ? "本周 · " : "") + `${md(a)}~${md(b)}`}; }
  if (dim === "month") { return {main: `${Number(id.slice(5))}月`, sub: id.slice(0,4)}; }
  return {main: "全部", sub: ""};
}
function renderPeriods(){
  document.querySelectorAll("#dimSeg button").forEach(b => b.classList.toggle("on", b.dataset.d === pref.dim));
  const box = $("#periods");
  if (pref.dim === "all") { box.innerHTML = '<span class="help">显示所有周期的卡片</span>'; pref.period = "all"; return; }
  const bs = bucketsFor(pref.dim);
  if (!bs.find(b => b.id === pref.period)) {
    const cur = pref.dim === "day" ? TODAY : pref.dim === "week" ? isoWeek(parse(TODAY)) : TODAY.slice(0,7);
    pref.period = (bs.find(b => b.id === cur) || bs[0] || {}).id || null;
  }
  box.innerHTML = bs.map(b => { const l = periodLabel(pref.dim, b.id);
    return `<button class="pchip ${b.id === pref.period ? "on" : ""}" data-p="${b.id}">${b.major ? '<span class="dot" title="有未完成的重大事项"></span>' : ""}<b>${l.main}</b><small>${l.sub} · ${b.n}</small></button>`; }).join("");
}
function renderHead(){
  const pool = cardsAll().filter(inPeriod);
  const active = pool.filter(c => ["open","watch"].includes(st(c)));
  const k = {
    major: active.filter(c => c.level === "major").length,
    focus: active.filter(c => c.level === "focus").length,
    todo: pool.filter(c => st(c) === "open").length,
    due: cardsAll().filter(c => c.due && ["open","watch"].includes(st(c)) && daysTo(c.due) <= 7).length,
  };
  let title, range, summary = "", tags = [];
  if (pref.dim === "all") { title = "全部周期"; range = `${D.periods.length} 份周期报告 · ${pool.length} 张卡片`; summary = (periodById(D.periods.find(p => p.type === "month")?.id) || {}).summary || ""; }
  else if (pref.dim === "week") {
    const p = periodById(pref.period), [a,b] = weekRange(pref.period);
    title = p ? p.label : `第${pref.period.split("-W")[1]}周`; range = `${a} ~ ${b}`; summary = p ? p.summary : "";
    tags.push("周报"); if (p && p.extracted_until) tags.push("抽取至 " + p.extracted_until); if (p && p.note) tags.push(p.note);
  } else if (pref.dim === "month") {
    const p = periodById(pref.period);
    title = p ? p.label : pref.period; range = p ? `${p.start} ~ ${p.end}` : pref.period; summary = p ? p.summary : "";
    tags.push("月报"); if (p && p.extracted_until) tags.push("抽取至 " + p.extracted_until);
  } else {
    const d = parse(pref.period); title = `${pref.period.slice(5).replace("-","月")}日 周${WEEKDAY[d.getDay()]}`; range = pref.period; tags.push("日报");
    const wk = periodById(isoWeek(d)); summary = `当天有 ${pool.length} 张卡片${wk ? `，属于「${wk.label}」。` : "。"}到期日在当天的卡片也会列在这里。`;
  }
  $("#phead").innerHTML = `<div><h2>${esc(title)}</h2><div class="range">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}${esc(range)}</div><p>${esc(summary)}</p></div>
  <div class="kpis">
    <button class="kpi major" data-k="major"><div class="n">${k.major}</div><div class="l">重大·未完成</div></button>
    <button class="kpi focus" data-k="focus"><div class="n">${k.focus}</div><div class="l">需关注·未完成</div></button>
    <button class="kpi" data-k="todo"><div class="n">${k.todo}</div><div class="l">待处理</div></button>
    <button class="kpi due" data-k="due"><div class="n">${k.due}</div><div class="l">7 天内到期</div></button>
  </div>`;
}
let carryAll = false;
function renderCarry(){
  const items = cardsAll().filter(c => !c.rollup && c.category !== "inbox" && ["open","watch"].includes(st(c)) && (c.level !== "info" || c.due))
    .sort((a,b) => (a.due || "9999").localeCompare(b.due || "9999") || D.levels[a.level].rank - D.levels[b.level].rank || b.date.localeCompare(a.date));
  const el = $("#carry");
  const wasOpen = el.dataset.init ? el.open : true; el.dataset.init = 1;
  el.innerHTML = `<summary>📌 跨周期未完成 <span class="hint">重大、需关注的事项和有截止日的卡片，不受周期筛选影响 · ${items.length} 项</span><span class="chev">›</span></summary>
    <ul>${items.slice(0, carryAll ? 99 : 6).map(c => { const cat = D.categories[c.category]; const due = c.due ? dueLabel(c.due) : null;
      return `<li data-go="${c.id}"><span class="lv ${c.level}">${D.levels[c.level].name}</span><span class="cat"><i style="background:${cat.color}"></i>${cat.name}</span><span class="t">${esc(c.title)}</span>${due ? `<span class="due ${due.cls}">${due.t}</span>` : "<span></span>"}<span class="from">${periodShort(c)}</span></li>`; }).join("")}
    ${items.length > 6 ? `<li class="more" data-more><span></span><span class="t" style="grid-column:2/-1;color:var(--accent)">${carryAll ? "收起" : `展开其余 ${items.length - 6} 项`}</span></li>` : ""}</ul>`;
  el.open = wasOpen;
}
function periodShort(c){
  const p = periodById(c.period); if (!p) return c.period;
  return (p.type === "month" ? "月报 " : p.type === "week" ? "周报 " : "") + (p.type === "week" ? "W" + p.id.split("-W")[1] : p.label);
}

/* ---------- 渲染：筛选 chips ---------- */
function renderChips(){
  const pool = cardsAll().filter(c => pref.view === "threads" || inPeriod(c));
  $("#lvChips").innerHTML = Object.entries(D.levels).map(([k,v]) =>
    `<button class="chip ${pref.levels.includes(k) ? "on" : ""}" data-lv="${k}"><i style="background:var(--${k})"></i>${v.name}<span class="c">${pool.filter(c => c.level === k).length}</span></button>`).join("")
    + `<span class="help" style="align-self:center;margin-left:6px">级别可多选，不选即全部</span>`;
  const cats = Object.entries(D.categories).filter(([k]) => (pref.showPrivate || k !== "private") && cardsAll().some(c => c.category === k));
  $("#catChips").innerHTML = cats.map(([k,v]) =>
    `<button class="chip ${pref.cats.includes(k) ? "on" : ""}" data-cat="${k}"><i style="background:${v.color}"></i>${v.name}<span class="c">${pool.filter(c => c.category === k).length}</span></button>`).join("");
  const chats = [...new Set(cardsAll().flatMap(c => c.chats))].sort((a,b) => a.localeCompare(b, "zh"));
  const cur = $("#fChat").value;
  $("#fChat").innerHTML = '<option value="">全部会话</option>' + chats.map(c => `<option ${c === cur ? "selected" : ""}>${esc(c)}</option>`).join("");
}

/* ---------- 渲染：卡片 ---------- */
const STATUS_BTNS = [["open","待处理"],["watch","跟进"],["done","完成"],["info","参考"]];
function cardHTML(c){
  const cat = D.categories[c.category], s = st(c), note = noteOf(c), due = c.due ? dueLabel(c.due) : null;
  const ev = (c.evidence || []).map(e => `<li>${esc(e[2])}<span class="m">${esc(e[0])} · ${esc(e[1])}${e[3] ? " · " + esc(e[3]) : ""}</span></li>`).join("");
  return `<article class="card ${c.level} ${s === "done" ? "is-done" : ""} ${note ? "has-note" : ""} ${sel.has(c.id) ? "sel" : ""}" id="card-${c.id}" data-id="${c.id}">
  <div class="in">
    <div class="chead"><span class="lv ${c.level}">${D.levels[c.level].name}</span><span class="cat"><i style="background:${cat.color}"></i>${cat.name}</span><span class="kind">${D.kinds[c.kind] || "信息"}</span>
      <span class="cdate">${md(c.date)} 周${WEEKDAY[parse(c.date).getDay()]}</span><span class="pbadge" title="来源周期">${periodShort(c)}</span></div>
    <h3>${esc(c.title)}</h3>
    <p class="sum">${esc(c.summary)}</p>
    ${c.action ? `<div class="action"><b>下一步</b>${esc(c.action)}</div>` : ""}
    <div class="meta">${due ? `<span class="due ${due.cls}">⏰ ${due.t}</span>` : ""}${c.thread ? `<span class="who" title="所属线索">🧵 ${esc(D.threads[c.thread] || c.thread)}</span>` : ""}${c.chats.slice(0,3).map(x => `<span class="who">💬 ${esc(x)}</span>`).join("")}${c.chats.length > 3 ? `<span class="who">+${c.chats.length - 3}</span>` : ""}</div>

function describeFilters(){
  const parts = [];
  if (pref.levels.length) parts.push("级别：" + pref.levels.map(k => D.levels[k].name).join("、"));
  if (pref.cats.length) parts.push("分类：" + pref.cats.map(k => D.categories[k].name).join("、"));
  const sMap = {active:"未完成", open:"待处理", watch:"跟进中", done:"已完成", info:"仅参考"};

  if ($("#q").value.trim()) parts.push("关键词：" + $("#q").value.trim());
  if ($("#fStar").checked) parts.push("仅星标");
  return parts.join("；") || "无";
}
function periodText(){
  if (pref.dim === "all") return {txt: "全部周期", start: null, end: null};
  if (pref.dim === "week") { const [a,b] = weekRange(pref.period); const p = periodById(pref.period); return {txt: `周 · ${p ? p.label : pref.period}（${a} ~ ${b}）`, start: a, end: b}; }
  if (pref.dim === "month") { const p = periodById(pref.period); const a = pref.period + "-01"; const e = new Date(parse(a).getFullYear(), parse(a).getMonth()+1, 0); return {txt: `月 · ${p ? p.label : pref.period}（${a} ~ ${fmt(e)}）`, start: a, end: fmt(e)}; }
  return {txt: `日 · ${pref.period}`, start: pref.period, end: pref.period};
}
function myStateLines(ids){
  const lines = [];
  Object.entries(S).forEach(([id, v]) => {
    if (ids && !ids.includes(id)) return;
    const c = D.cards.find(x => x.id === id); if (!c) return;
    const bits = [];
    if (v.status && v.status !== c.status) bits.push({open:"待处理",watch:"跟进中",done:"已完成",info:"仅参考"}[v.status]);
    if (v.star) bits.push("★");
    if (v.note) bits.push("备注：" + v.note.replace(/\s+/g, " "));
    if (bits.length) lines.push(`- ${id}「${c.title}」→ ${bits.join("；")}`);
  });
  return lines;
}
function buildQuery(cards, scopeTxt){
  const pt = periodText();

  const kws = [...new Set(cards.flatMap(c => (c.query && c.query.keywords) || []))];
  const starts = cards.map(c => (c.query && c.query.start) || c.date), ends = cards.map(c => (c.query && c.query.end) || c.date);
  let start = starts.length ? starts.sort()[0] : pt.start, end = ends.length ? ends.sort().reverse()[0] : pt.end;
  if (end && end > TODAY) end = TODAY;
  const ids = cards.map(c => c.id);
  const state = myStateLines(ids);
  const shq = s => `"${s.replace(/(["\\$`])/g, "\\$1")}"`;
  const prompt = [
    "请用本机的「微信洞察」工具帮我查询微信聊天数据，核对并更新卡片。",

    "",
    `【关注卡片】（${cards.length} 张）`,
    ...cards.slice(0, 40).map(c => `- ${c.id}〔${D.levels[c.level].name}·${D.categories[c.category].name}〕${c.title}${c.due ? `（截止 ${c.due}）` : ""}`),
    ...(cards.length > 40 ? [`- ……另有 ${cards.length - 40} 张`] : []),

    `- 会话：${chats.slice(0, 20).join("、") || "（按周期全部会话）"}`,
    `- 关键词：${kws.slice(0, 20).join("、") || "（无）"}`,
    `- 时间：${start || "?"} ~ ${end || "?"}`,
    ...(state.length ? ["", "【我已处理 / 备注】", ...state] : []),
    "",
    "【我想知道】",
    "（在这里写你的问题，例如：这件事最新进展到哪了？有没有我漏回的消息？）",
    "",

  ].join("\n");
  const cmds = [];
  if (start && end) cmds.push(`~/.wechat-cli/venv/bin/python ~/wechat-insights/extract.py --start ${start} --end ${end} --full ${chats.slice(0, 8).map(c => "--chat " + shq(c)).join(" ")}`);
  kws.slice(0, 4).forEach(k => cmds.push(`~/.wechat-cli/venv/bin/wechat-cli search ${shq(k)}${start ? " --start-time " + start : ""} --limit 50 --format text`));
  return {prompt, cmds: cmds.join("\n")};
}

const STEP_ICON = {pending: "○", running: "◌", done: "✓", error: "✕", skipped: "–"};
function mdLite(t){

}

  </ul></div>`;

    ${(r.added || []).map(c => `<li>新增 <a href="#" data-goto="${c.id}">${esc(c.id)} ${esc(c.title)}</a></li>`).join("")}
    ${(r.changed || []).map(c => `<li>更新 <a href="#" data-goto="${c.id}">${esc(c.id)} ${esc(c.title)}</a></li>`).join("")}

  const sc = e.target.closest("[data-snscard]"); if (sc) { const it = snsCache.data.items.find(x => x.tid === sc.dataset.snscard); if (!it) return;
    sc.disabled = true; sc.textContent = "保存中…";
    api("/api/sns/card", {item: it, category: SNS_CAT[it.tags[0]] || "people"}).then(r => { toast(r.ok ? "已做成卡片" : "保存失败"); if (r.ok) setTimeout(() => location.reload(), 500); })
      .catch(err => { sc.disabled = false; sc.textContent = "＋ 做成卡片"; toast("保存失败：" + err.message); }); return; }
  const sa = e.target.closest("[data-snsask]"); if (sa) { const it = snsCache.data.items.find(x => x.tid === sa.dataset.snsask); if (!it) return;
    const r = snsRange(); const ch = "朋友圈·" + it.name;
    openQuery([{id: "朋友圈", level: "info", category: "people", title: `${it.name} 的朋友圈`, period: "朋友圈", date: it.time.slice(0,10), chats: [ch], people: [it.name], tags: [], evidence: [], query: {chats: [ch], keywords: [], start: r.start, end: r.end}}], `${it.name} 的朋友圈`); return; }
  if (e.target.closest("[data-ibmore]")) { inboxAll = !inboxAll; renderInbox(); return; }
  const ibd = e.target.closest("[data-ibdone]"); if (ibd) { const prev = setStatus(ibd.dataset.ibdone, "done"); renderInbox(); renderHead(); undoToast("已处理", ibd.dataset.ibdone, prev); return; }
  const ibq = e.target.closest("[data-ibq]"); if (ibq) { const c = D.cards.find(x => x.id === ibq.dataset.ibq); if (c) openQuery([c], "提醒 · " + c.title); return; }
  const ud = e.target.closest("[data-undone]"); if (ud) { e.stopPropagation(); const prev = setStatus(ud.dataset.undone, "open"); renderAll(); undoToast("已放回待处理", ud.dataset.undone, prev); return; }
  const dx = e.target.closest("[data-dexp]"); if (dx && !e.target.closest(".dexp")) { const id = dx.dataset.dexp, box = document.getElementById("dexp-" + id);
    if (box.hidden) { box.innerHTML = cardHTML(D.cards.find(x => x.id === id)); box.hidden = false; } else { box.hidden = true; box.innerHTML = ""; } return; }
  const go = e.target.closest("[data-go]"); if (go) { goTo(go.dataset.go); return; }
  if (e.target.closest("#clearF")) { pref.levels = []; pref.cats = []; pref.status = ""; $("#fStatus").value = ""; $("#q").value = ""; $("#fChat").value = ""; $("#fStar").checked = false; renderAll(); return; }
  const tq = e.target.closest("[data-tq]"); if (tq) { const t = tq.dataset.tq; openQuery(cardsAll().filter(c => (c.thread || "_") === t), "线索「" + (D.threads[t] || "未归类") + "」的全部卡片"); return; }
  const card = e.target.closest(".card"); if (!card) return;
  const id = card.dataset.id, c = D.cards.find(x => x.id === id);
  const sb = e.target.closest(".st button");
  if (sb) {
    const s = sb.dataset.s, prev = setStatus(id, s);
    renderHead(); renderCarry(); renderPeriods(); renderChips(); $("#doneCnt").textContent = cardsAll().filter(isDone).length || "";
    if (s === "done" && pref.view !== "done") {
      card.classList.add("leaving"); setTimeout(() => { card.remove(); if (!$("#content .card")) renderContent(); }, 260);
      undoToast("已完成，收进「已完成」", id, prev);
    } else if (pref.view === "done" && s !== "done") { renderContent(); undoToast("已恢复为" + ({open:"待处理",watch:"跟进",info:"参考"}[s]), id, prev); }
    else card.outerHTML = cardHTML(c);
    return;
  }
  const act = e.target.closest("[data-act]"); if (!act) return;
  if (act.dataset.act === "star") { setState(id, {star: !starred(c)}); card.outerHTML = cardHTML(c); }
  else if (act.dataset.act === "note") { card.classList.add("edit-note"); card.querySelector(".note").focus(); }
  else if (act.dataset.act === "query") openQuery([c], `单张卡片 ${id}`);
  else if (act.dataset.act === "pick") { act.checked ? sel.add(id) : sel.delete(id); card.classList.toggle("sel", act.checked); renderBatch(); }
});
document.addEventListener("change", e => { if (e.target.id === "snsAuthor") { snsAuthor = e.target.value; renderSns(); return; } });
document.addEventListener("change", e => { const n = e.target.closest(".note"); if (!n) return; const id = n.closest(".card").dataset.id; setState(id, {note: n.value.trim()}); toast("备注已保存"); });

$("#btnQuery").onclick = () => {
  const list = cardsAll().filter(c => inPeriod(c) && matchFilters(c)).sort(rankSort);
  openQuery(list, sel.size ? "当前筛选结果（如只想查选中的，用底部「生成查询指令」）" : "当前筛选结果");
};
$("#btnUpdate").onclick = openUpdate;
$("#bQuery").onclick = () => openQuery(D.cards.filter(c => sel.has(c.id)).sort(rankSort), `手动选中的 ${sel.size} 张卡片`);
$("#bDone").onclick = () => { const n = sel.size; sel.forEach(id => setStatus(id, "done")); sel.clear(); renderAll(); toast(`${n} 张已完成，收进「已完成」`); };
$("#bClear").onclick = () => { sel.clear(); renderAll(); };
$("#modal").onclick = e => { if (e.target.id === "modal" || e.target.closest("[data-close]")) closeModal(); };

$("#btnMore").onclick = e => { e.stopPropagation(); $("#menu").classList.toggle("open"); };
document.addEventListener("click", e => { if (!e.target.closest("#menu")) $("#menu").classList.remove("open"); });
$("#mPrivate").checked = pref.showPrivate;
$("#mPrivate").onchange = e => { pref.showPrivate = e.target.checked; renderAll(); };
$("#mTheme").onclick = () => { const dark = matchMedia("(prefers-color-scheme: dark)").matches; const now = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  pref.theme = now === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = pref.theme; save(PREF, pref); };
$("#mExport").onclick = () => {
  const blob = new Blob([JSON.stringify({exported_at: new Date().toISOString(), state: S}, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "wechat-insights-state.json"; a.click(); URL.revokeObjectURL(a.href);
  toast("已导出，可放到 ~/wechat-insights/state.json 供 Claude 读取");
};
$("#mImport").onclick = () => $("#fileImport").click();
$("#fileImport").onchange = async e => { const f = e.target.files[0]; if (!f) return;
  try { const j = JSON.parse(await f.text()); S = Object.assign({}, S, j.state || j); save(STORE, S); renderAll(); toast("已导入"); } catch (err) { toast("文件格式不对"); } e.target.value = ""; };
$("#mReset").onclick = () => { if (confirm("清空本机记录的状态、星标和备注？卡片本身不受影响。")) { S = {}; save(STORE, S); renderAll(); } };
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeModal(); $("#menu").classList.remove("open"); }
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
});

renderAll();
if (SV) { api("/api/state").then(r => { const remote = (r && r.state) || {}; let changed = false;
    Object.entries(remote).forEach(([id, v]) => { if (!S[id] || (v.updated || "") > (S[id].updated || "")) { S[id] = v; changed = true; } });
    if (changed) { migrateState(); renderAll(); } pushState(); }).catch(() => {});
  setBadge(); setInterval(setBadge, 20000);
  api("/api/status").then(s => { if (s.running) { openLiveUpdate(); followJob(s.running.id, $("#uJob")); } }).catch(() => {}); }
else $("#svBadge").innerHTML = '<span title="从「微信洞察」App 打开可直接在页面里更新数据、问 Claude">离线模式</span>';
if (location.hash.length > 1) { const id = location.hash.slice(1); history.replaceState(null, "", location.pathname); setTimeout(() => goTo(id), 50); }
})();
</script>
</body>
</html>
